<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowPurple" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBlue" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="15%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients for Badges & Accents -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.75" />
    </linearGradient>

    <!-- Animations -->
    <style>
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.2); opacity: 1; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -60; }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(-1deg); }
      }
      @keyframes floatSlow3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.6; }
      }
      .anim-dash-1 {
        stroke-dasharray: 8, 8;
        animation: dashMove 3s linear infinite;
      }
      .anim-dash-2 {
        stroke-dasharray: 6, 6;
        animation: dashMove 4.5s linear infinite;
      }
      .anim-float-1 {
        animation: floatSlow1 6s ease-in-out infinite;
      }
      .anim-float-2 {
        animation: floatSlow2 7s ease-in-out infinite;
      }
      .anim-float-3 {
        animation: floatSlow3 5s ease-in-out infinite;
      }
      .anim-pulse {
        animation: pulseNode 3s ease-in-out infinite;
        transform-origin: center;
      }
      .anim-glow {
        animation: glowPulse 4s ease-in-out infinite;
      }
      .font-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .font-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.2px;
      }
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- 1. Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- 2. Ambient Glow Spheres (Underneath) -->
  <circle cx="240" cy="120" r="300" fill="url(#glowPurple)" class="anim-glow" />
  <circle cx="980" cy="280" r="280" fill="url(#glowBlue)" class="anim-glow" />
  <circle cx="600" cy="50" r="240" fill="url(#glowCyan)" class="anim-glow" />

  <!-- 3. Tech Grid Overlay -->
  <g opacity="0.12" stroke="#64748b" stroke-width="0.8">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="750" y1="0" x2="750" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1050" y1="0" x2="1050" y2="400" />
  </g>

  <!-- 4. Background Animated Flow Paths & Event Circuit Lines -->
  <g fill="none" stroke-linecap="round">
    <!-- Flow 1: Top Left to Bottom Right behind center -->
    <path d="M 60 70 Q 250 20 400 120 T 800 280 T 1140 220" stroke="#8b5cf6" stroke-width="2" opacity="0.4" class="anim-dash-1" />
    <!-- Flow 2: Bottom Left to Top Right -->
    <path d="M 80 340 Q 300 370 500 260 T 950 110 T 1150 140" stroke="#06b6d4" stroke-width="2" opacity="0.35" class="anim-dash-2" />
    <!-- Flow 3: Subtle Loop Line -->
    <path d="M 120 180 C 260 220 320 60 480 90" stroke="#ec4899" stroke-width="1.5" opacity="0.3" class="anim-dash-1" />
    <path d="M 720 310 C 880 340 980 200 1100 240" stroke="#3b82f6" stroke-width="1.5" opacity="0.3" class="anim-dash-2" />
  </g>

  <!-- 5. Dynamic Background Floating Component / Event Pills (Peripheral, outside text bounds) -->
  <!-- Top Left Pill: Event Listener -->
  <g class="anim-float-1" transform="translate(70, 45)">
    <rect width="180" height="34" rx="17" fill="url(#pillGrad)" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="20" cy="17" r="4.5" fill="#a855f7" class="anim-pulse" />
    <text x="34" y="21" fill="#c084fc" class="font-mono">⚡ onEvent("action")</text>
  </g>

  <!-- Top Right Pill: Reactive Binding -->
  <g class="anim-float-2" transform="translate(930, 45)">
    <rect width="195" height="34" rx="17" fill="url(#pillGrad)" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="20" cy="17" r="4.5" fill="#22d3ee" class="anim-pulse" />
    <text x="34" y="21" fill="#67e8f9" class="font-mono">🔄 {{ state.binding }}</text>
  </g>

  <!-- Bottom Left Pill: Event Dispatcher -->
  <g class="anim-float-2" transform="translate(60, 320)">
    <rect width="185" height="34" rx="17" fill="url(#pillGrad)" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="20" cy="17" r="4.5" fill="#f43f5e" class="anim-pulse" />
    <text x="34" y="21" fill="#fda4af" class="font-mono">📡 dispatch.sync()</text>
  </g>

  <!-- Bottom Right Pill: Component Target -->
  <g class="anim-float-1" transform="translate(940, 320)">
    <rect width="190" height="34" rx="17" fill="url(#pillGrad)" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="20" cy="17" r="4.5" fill="#60a5fa" class="anim-pulse" />
    <text x="34" y="21" fill="#93c5fd" class="font-mono">📦 &lt;TargetConfig /&gt;</text>
  </g>

  <!-- Peripheral Mini Nodes -->
  <circle cx="280" cy="65" r="3" fill="#a855f7" opacity="0.7" />
  <circle cx="910" cy="70" r="3" fill="#06b6d4" opacity="0.7" />
  <circle cx="270" cy="335" r="3" fill="#f43f5e" opacity="0.7" />
  <circle cx="920" cy="335" r="3" fill="#3b82f6" opacity="0.7" />

  <!-- 6. FOREGROUND HERO CONTAINER - Guarantees Title & Subtitle Never Get Obscured -->
  <g transform="translate(180, 85)">
    <!-- High-contrast backdrop container with subtle glow & blur protection -->
    <rect width="840" height="230" rx="20" fill="url(#cardGrad)" stroke="url(#accentGrad)" stroke-width="1.8" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.7))" />
    
    <!-- Top Category Micro-Badge -->
    <g transform="translate(305, 20)">
      <rect width="230" height="24" rx="12" fill="#312e81" stroke="#6366f1" stroke-width="1" opacity="0.9" />
      <text x="115" y="16" fill="#c7d2fe" class="font-mono" text-anchor="middle" font-size="10">⚡ REACTIVE ARCHITECTURES</text>
    </g>

    <!-- Main Title -->
    <text x="420" y="92" fill="#ffffff" text-anchor="middle" class="font-title" font-size="36">
      Awesome Event-Driven
    </text>
    <text x="420" y="134" fill="url(#accentGrad)" text-anchor="middle" class="font-title" font-size="34">
      Component Framework
    </text>

    <!-- Subtitle -->
    <text x="420" y="174" fill="#94a3b8" text-anchor="middle" class="font-sub" font-size="15">
      Curated Ecosystem of Low-Code Platforms, Reactive UI Binders &amp; Dynamic Interaction Runtimes
    </text>

    <!-- Bottom Tech Stack Pill Row Inside Protected Foreground -->
    <g transform="translate(140, 194)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="105" height="22" rx="11" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="52" y="15" fill="#cbd5e1" class="font-mono" text-anchor="middle" font-size="10">⚡ Reactive UI</text>

      <!-- Tag 2 -->
      <rect x="115" y="0" width="105" height="22" rx="11" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="167" y="15" fill="#cbd5e1" class="font-mono" text-anchor="middle" font-size="10">🛠️ Low-Code</text>

      <!-- Tag 3 -->
      <rect x="230" y="0" width="105" height="22" rx="11" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="282" y="15" fill="#cbd5e1" class="font-mono" text-anchor="middle" font-size="10">📡 Event Bus</text>

      <!-- Tag 4 -->
      <rect x="345" y="0" width="105" height="22" rx="11" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="397" y="15" fill="#cbd5e1" class="font-mono" text-anchor="middle" font-size="10">🖥️ Internal Tools</text>

      <!-- Tag 5 -->
      <rect x="460" y="0" width="100" height="22" rx="11" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="510" y="15" fill="#cbd5e1" class="font-mono" text-anchor="middle" font-size="10">🌐 Open Source</text>
    </g>
  </g>
</svg>
